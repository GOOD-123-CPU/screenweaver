name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate example configs
        run: npm run check:configs

      - name: Unit tests
        run: npm test

      - name: Type check & build
        run: npm run build

      - name: Library build
        run: npm run build:lib
